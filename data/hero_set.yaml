# The reviewed drug-target complexes for the 3D view (#6). `ingest complexes` (#7) builds only these.
# Chosen from data/build/complex_candidates.md by the rules in docs/decisions/hero-complexes.md and
# checked live against RCSB on 2026-10-13: every ligand copy exists and is complete.
#
# drug:        the name in scope.yaml
# pdb:         the RCSB entry
# ligand_code: the ligand's chemical component ID (the active form for prodrugs)
# ligand_copy: the ligand instance as author chain/residue number; an entry can hold several copies
# chain:       the polymer chain with the most contacts to that copy (RNA for azithromycin)
# target:      the target as ChEMBL names it (gene symbol)
# organism:    the chain's source organism
# showcase:    the cleanest entries, for the landing page and demos
# caption:     shown with the structure when it isn't simply the drug in its main target
# exclude_chains: polymer chains left out of the view, such as an engineered binder at the pocket
# note:        why this entry

