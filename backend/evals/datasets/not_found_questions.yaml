# Questions with a drug name Molecula doesn't know (#181, #190). `typed` is the unknown name as
# the question writes it, and `suggestions` the names `CompoundService.resolve` offers for it, as
# `alias (name)`, checked on main 74aebb0. The answer should say the name wasn't found and offer
# the suggestions as written, or ask which drug is meant when there are none, and never say a
# suggested drug has no data or name a drug the tools didn't return. `turns` are the user's
# messages in order; the last answer is scored. Since #196 the store has no metamizole, so
# Novaminsuflon gets no suggestion and the answer should ask which drug is meant.

