# Questions about metamizole, the one stored drug without a US label (#182), and controls where
# every drug named has one. `turns` are the user's messages in order; the eval answers each and
# scores the last answer. No tool returns metamizole's uses, class or side effects (ChEMBL gives
# only "Cyclooxygenase inhibitor"), so whatever an answer says about them comes from memory.

- id: two-turn-imatinib-then-metamizole
