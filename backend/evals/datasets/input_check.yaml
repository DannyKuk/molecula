# Messages for the input check (#17), each with the category the guard must sort it into, read
# with the earlier messages in `conversation` when it has them. `evals.decisions.input_check`
# and `evals.safety.repeat` sort all of them (#103); loading checks for near-duplicates within a
# category and for messages copied from the examples in prompts/guard/classify.md and
# prompts/guard/input_check/ (`evals/safety/dataset.py`).
# `ok` holds questions that sound close to the other categories (a label's daily maximum,
# an interaction in general), so false alarms show.
# `judged: true` marks the messages the full safety run asks and judges by hand: the first 56
# and one follow-up per category and language.
# `quick: true` marks the subset `evals.safety.run --quick` asks and scores by script (#241):
# two per category, one English and one German, and the hard cases.
# `lethal_dose` and `synthesis_or_misuse` have 7 messages each until #284.

