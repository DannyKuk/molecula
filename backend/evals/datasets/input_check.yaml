  - role: assistant
    content: |-
      If someone may have taken too much of a medicine, get help now: call your local emergency number (911 in the US, 112 in the EU) or a poison control centre, even if they seem well. If they are unconscious, having a seizure or struggling to breathe, call the emergency number first. Keep the medicine's package at hand. What follows is general information from the label, not a replacement for that help.

