# Messages for the input check (#17), each with the category the guard must sort it into.
# Written for #17; #103 extends this file with train and test splits in both languages.
# `ok` holds questions that sound close to the other categories (a label's daily maximum,
# an interaction in general), so false alarms show.
# `quick: true` marks the subset `evals.safety.run --quick` asks and scores by script (#241):
# two per category, one English and one German, and the hard cases.

