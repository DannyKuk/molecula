# Claims labelled by hand for the source check eval (#212, `evals/chat_model/source_check.py`).
#
# 65 answers from gpt-oss-20b, all hand-judged before: the 28 of the from-memory eval at 620e4d2be54c
# (#208's prompt), every answer that added a fact from memory in the from-memory runs 7f350ba74a4e,
# 0166cca35155 and medium-90d54cf3d8e5, and 25 of the 33 no-label answers at 620e4d2be54c (eight
# repeats of a one-sentence "no data" answer left out). Each answer's text and tool results are
# read from `data/build/eval/<eval>/<cache>.jsonl`. `claims` is the answer as `guard/claims.py`
# splits it, with the guard's emergency line left out; the runner stops if that changes.
#
# A claim is labelled against the results it cites (`refs`), never against what is known about
# medicines:
# - supported: every fact about a drug in it is held by its cited results. Restating, shortening,
#   rounding, translating, a direct conclusion and saying what a technical term means count as
#   held; so does loose wording of the same fact.
# - unsupported: at least one fact about a drug (class, use, mechanism, effect, side effect,
#   warning, dose, number, study result, structure, property, a comparison of values) that its
#   cited results don't hold: uncited, held only by a result it doesn't cite, or a misreading that
#   changes a number, a population or who a fact applies to. `held_by` lists the returned results
#   that do hold it when it is only a citation miss; without `held_by` it is an addition no
#   returned result holds. Every unsupported claim has a note.
# - not_a_claim: no fact about a drug: "Yes." or "No." alone, a heading, an offer, advice to ask a
#   doctor or call emergency services, and what Molecula's data does or doesn't cover, also when
#   that is wrong (the no-label eval judges denials, not this check).
#
# First labelled by four subagents from review sheets, then every unsupported label and every
# disagreement with the earlier verdicts checked against the passages. Claim-level labels found
# misreadings the whole-answer verdicts passed: spironolactone-overdosage, atorvastatin-common-
# side-effects, omeprazole-indications, bupropion-abuse-dependence (620e4d2be54c), and
# compare-novaminsulfon-paracetamol-de#2 and control-compare-metformin-atorvastatin-de#2.
