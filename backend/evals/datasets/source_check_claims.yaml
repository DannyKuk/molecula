      - **Formula**: Dipyrone is C₁₃H₁₇N₃O₄S; ibuprofen is C₁₃H₁₈O₂. The extra nitrogen, oxygen, and sulfur
      atoms give dipyrone a more polar structure [1][2].

      - **Lipophilicity**: Dipyrone’s XLogP is 0.0, indicating it is relatively hydrophilic, whereas ibuprofen’s
      XLogP of 3.5 shows it is much more lipophilic [1][2].

      - **Polar surface area (TPSA)**: Dipyrone has a TPSA of 89.5 Å², higher than ibuprofen’s 37.3 Å²,
      reflecting greater potential for hydrogen‑bonding interactions [1][2].

      - **Hydrogen bonding**: Both have one H‑bond donor; dipyrone offers six acceptors compared to ibuprofen’s
      two, again indicating a more polar profile [1][2].

      - **Rotatable bonds and heavy atoms**: Each has four rotatable bonds, but dipyrone contains 21 heavy
      atoms versus ibuprofen’s 15, contributing to its larger size [1][2].'
    refs:
    - 1
    - 2
    label: supported
    note: Interpretations (more polar, hydrophilic, hydrogen-bonding potential) explain what the cited
      values mean; all numbers match sources 1 and 2.
