- id: spironolactone-overdosage#1
  from_memory: true
  denies_data: false
  note: >-
    Drowsiness, confusion, rash, nausea, vomiting, dizziness and diarrhea are in [1], and
    hyperkalemia "may occur" is also in [1]. But "In some cases, dangerously abnormal blood
