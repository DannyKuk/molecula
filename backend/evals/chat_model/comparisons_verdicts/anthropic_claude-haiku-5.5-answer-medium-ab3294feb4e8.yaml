- id: diff-metformin-glimepiride#1
  from_memory: true
  denies_data: false
  note: >-
    Mechanisms and ChEMBL targets match [1]-[4]/[10], and metformin's unchanged urinary
    excretion is in [8]. But "it is broken down in the liver mainly by the enzyme cytochrome
    P450 2C9": [11] says only that CYP2C9 "is involved in the biotransformation of glimepiride
    to M1"; no result names the liver or says "mainly" (close call).
- id: diff-metformin-glimepiride#2
  from_memory: true
  denies_data: false
  note: >-
    "Common side effects include diarrhea, abdominal discomfort and headache": [19] is a table
    fragment that gives abdominal discomfort and headache at 6% vs 5% and diarrhea only as
    leading to discontinuation in 6%; it never calls these common (close call). Mechanisms,
    indications, weight gain, hypoglycemia 19.7% vs 3.2% and the pediatric HbA1c result all
    match.
- id: diff-metformin-glimepiride#3
  from_memory: false
  denies_data: true
  note: >-
    Mechanisms and ChEMBL targets match [1]-[4]/[10]; the ATP-sensitive channel gloss is a term
    definition. But it says "Molecula's data does not cover side effects, warnings,
    interactions, or dosing for these two drugs": it never searched side effects or warnings,
    and the returned passages [5]/[8]/[12] do hold interactions (aspirin, colesevelam,
    propranolol, cimetidine).
