# Hand verdicts for docs/decisions/chat-model.md (#386): whether each answer states a drug fact no tool
# result of that answer holds (from_memory), or says Molecula has no data it never searched
# (denies_data). Judged by two subagents against the from-memory eval's RULES, flags re-read by hand.
# "Cyclooxygenase makes prostaglandins" is a gloss of the enzyme's name; tying it to pain or
# inflammation without a result that does counts. The comparisons eval doesn't read this file.

- id: typo-3d-ibuprofen-aspirin#1
  from_memory: false
  denies_data: true
  note: >-
    Structure (4PH9, mouse PTGS2, H-bonds TYR356 and ARG121 at 2.44/2.71/2.85 Å, contacts) and
    every table cell match get_complex and compare_drugs; "also called COX-2" is a synonym of
    the result's PTGS2. But it never called search_labels or get_targets and says "Molecula's
    data does not say what this binding does in the body, so I can't go further on how the drug
    works", which Molecula does hold (ChEMBL COX inhibitor, label mechanism).
- id: typo-3d-ibuprofen-aspirin#2
  from_memory: false
  denies_data: true
  note: >-
    Structure description and every table cell match get_complex and compare_drugs. It never
    searched labels or targets yet says "Molecula's data doesn't say how ibuprofen and aspirin
    compare in how they work or in their effects on the body".
- id: typo-3d-ibuprofen-aspirin#3
  from_memory: false
  denies_data: true
  note: >-
    Structure and property values match get_complex and compare_drugs ("a stand-in" is not in
    the result, but it is about the structure, not a drug fact). It never called get_complex for
    aspirin yet says "Molecula's data doesn't include a 3D structure of aspirin bound to its
    target"; the store has one (3N8Y, as 3d-ibuprofen-aspirin#1 shows).
- id: 3d-ibuprofen-aspirin#1
  from_memory: true
  denies_data: false
  note: >-
    "PTGS2 enzyme (also called COX-2, a protein that helps make inflammation signals)": no
    result of this answer mentions inflammation or prostaglandins (only get_complex and
    compare_drugs ran), so this states the target's function from memory. It also swaps the bond
    count: "two with the tyrosine at position 356 and one with the arginine at 121", while the
    result has one with TYR356 and two with ARG121. Aspirin's 3N8Y caption and the properties
    match.
- id: 3d-ibuprofen-aspirin#2
  from_memory: true
  denies_data: true
  note: >-
    "cyclooxygenase-2 (COX-2, PTGS2), an enzyme that makes inflammatory signalling molecules
    called prostaglandins": get_targets only says "Cyclooxygenase inhibitor" and no result names
    prostaglandins or inflammation (close call: the term cyclooxygenase is in the result). It
    never called get_complex for aspirin yet says "Molecula has no reviewed 3D structure of
    aspirin bound to its target" (3N8Y exists), and never searched labels yet says the data
    "doesn't say how the two drugs differ in clinical use or side effects".
- id: 3d-ibuprofen-aspirin#3
  from_memory: true
  denies_data: false
  note: >-
    "PTGS2, an enzyme that makes prostaglandins (chemical messengers involved in pain and
    inflammation)": only get_complex and compare_drugs ran and neither names prostaglandins.
    Both structures, the 3N8Y caption and the properties match. "Doesn't cover how these
    structures translate into effects in people, or which dose to take" is not a denial: the
    store doesn't map a structure to effects, and personal dosing is refused anyway.
