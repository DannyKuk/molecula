  denies_data: false
  note: >-
    "PTGS2 — the enzyme cyclooxygenase-2, a protein that helps make the signalling molecules
    behind pain and inflammation": only get_complex and compare_drugs ran, and neither names
    prostaglandins, pain or inflammation. Contacts, H-bonds (2.44/2.71/2.85 Å), mouse and every
    table cell match.
