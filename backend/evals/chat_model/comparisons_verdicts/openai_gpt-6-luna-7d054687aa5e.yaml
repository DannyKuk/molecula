- id: diff-metformin-glimepiride#1
  from_memory: true
  denies_data: false
  note: >-
    "Metformin's label also warns about a rare but serious risk called lactic acidosis": the
    lactic acidosis passages describe postmarketing cases including fatal ones but never call it
    rare, so the frequency qualifier is from memory. Everything else (mechanisms, GI effects,
    glimepiride hypoglycemia/weight gain/headache/nausea/dizziness, combined hypoglycemia risk
    with secretagogues) is in the passages.
- id: diff-metformin-glimepiride#2
  from_memory: false
  denies_data: false
  note: >-
    Metformin mechanism (hepatic glucose production, intestinal absorption, peripheral uptake,
    insulin secretion unchanged) and glimepiride mechanism (sulfonylurea receptor on beta cells,
    closure of the ATP-sensitive potassium channel, insulin release) both come from the
    mechanism-of-action passages.
- id: diff-metformin-glimepiride#3
  from_memory: false
  denies_data: false
  note: >-
    "helps the body respond to insulin" glosses "improves insulin sensitivity"; insulin
    secretion unchanged and glimepiride stimulating insulin release are in the mechanism
    passages.
