    covalently attached to Ser530, blocking the enzyme" glosses the caption's "moves its acetyl
    group onto Ser530, which blocks the enzyme"; COX-1/COX-2 are synonyms of PTGS1/PTGS2.
- id: typo-3d-ibuprofen-aspirin#3
  from_memory: false
