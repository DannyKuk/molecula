# (denies_data). Judged by a subagent against the from-memory eval's RULES, flags re-read by hand.
# openai/gpt-oss-20b in LM Studio, OFFLINE=1, ANSWER_REASONING_EFFORT=medium, main at 2ce1626.

- id: typo-3d-ibuprofen-aspirin#1
  from_memory: false
  denies_data: true
  note: >-
    The 4PH9 structure (mouse PTGS2, H-bonds TYR356 OH and ARG121 NH2/NE at 2.44/2.71/2.85 Å,
    contacts 3.32 to 3.95 Å) matches get_complex; "cyclooxygenase-2" is a synonym of PTGS2. But it
    only called get_complex for ibuprofen and says "I do not have a reviewed structure of aspirin
    bound to its target in Molecula's database"; the store has 3N8Y.
- id: typo-3d-ibuprofen-aspirin#2
  from_memory: false
  denies_data: false
