[project]
name = "molecula"
version = "0.1.0"
description = "Medicines chatbot backend: RAG over FDA drug labels, chemistry tools and 3D drug-target structures"
requires-python = ">=3.14,<3.15"
dependencies = [
    "biotite>=1.7.1",
    "chromadb>=1.5.9",
    "fastapi>=0.115",
    "httpx2>=2.13.1",
    "huggingface-hub>=1.33.0",
    "langchain>=1.0",
    "langchain-core>=1.6.9",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.0",
    "mcp>=1.30.0,<2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "rdkit>=2026.9.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
addopts = "--import-mode=importlib"

# CPU-only PyTorch for sentence-transformers: the CUDA build is several GB and the app runs on CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
