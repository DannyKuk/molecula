services:
  # Downloads the store and the embedding model into ./data when they are missing, then exits.
  # A step of its own, because the 2.3 GB model wouldn't fit in the backend's healthcheck window.
  fetch:
    build: ./backend
    command: ["python", "-m", "molecula.ingest", "fetch"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data

  backend:
    build: ./backend
    depends_on:
      fetch:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      # The slim image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # The agent's tools for any MCP client, over streamable HTTP at http://localhost:8001/mcp (#42).
  # Only with `--profile mcp`: it loads its own copy of the embedding model. No auth, so the port
  # is published on this machine only.
  mcp:
    profiles: ["mcp"]
    build: ./backend
    command: ["python", "-m", "molecula.mcp", "--transport", "streamable-http", "--host", "0.0.0.0"]
    depends_on:
      fetch:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
